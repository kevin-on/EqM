name: Build and Push Docker Image

on:
  workflow_dispatch:  # Manual trigger
  # Uncomment to enable automatic builds on push to main
  # push:
  #   branches:
  #     - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/eqm:latest
            ${{ secrets.DOCKER_USERNAME }}/eqm:${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/eqm:latest
          cache-to: type=inline

      - name: Image built successfully
        run: |
          echo "Docker image built and pushed successfully!"
          echo "Image: ${{ secrets.DOCKER_USERNAME }}/eqm:latest"
          echo "Tag: ${{ secrets.DOCKER_USERNAME }}/eqm:${{ github.sha }}"
